services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticket_booking
      POSTGRES_USER: ticket_booking
      POSTGRES_PASSWORD: ticket_booking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_booking -d ticket_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrations:
    image: flyway/flyway:11-alpine
    command:
      - -connectRetries=60
      - -url=jdbc:postgresql://postgres:5432/ticket_booking
      - -user=ticket_booking
      - -password=ticket_booking
      - migrate
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ticket_booking
      RABBITMQ_DEFAULT_PASS: ticket_booking
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    profiles: ["api"]
    build: ./packages/api
    command: yarn dev
    environment:
      PORT: "8080"
      AUTH_SERVICE_URL: http://auth:8081
      BOOKING_SERVICE_URL: http://booking:8083
      DATABASE_URL: postgres://ticket_booking:ticket_booking@postgres:5432/ticket_booking
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-development-jwt-secret-change-before-production
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      auth:
        condition: service_started
      booking:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./packages/api/src
          target: /app/src
        - action: rebuild
          path: ./packages/api/package.json
        - action: rebuild
          path: ./packages/api/yarn.lock

  auth:
    profiles: ["auth"]
    build: ./packages/auth
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://ticket_booking:ticket_booking@postgres:5432/ticket_booking?sslmode=disable
      JWT_SECRET: local-development-jwt-secret-change-before-production
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "8081:8081"
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./packages/auth/main.go
        - action: rebuild
          path: ./packages/auth/go.mod
        - action: rebuild
          path: ./packages/auth/go.sum
        - action: rebuild
          path: ./packages/auth/Dockerfile

  notification:
    profiles: ["notification"]
    build: ./packages/notification
    command: fastapi dev main.py --host 0.0.0.0 --port 8082
    environment:
      PORT: "8082"
    ports:
      - "8082:8082"
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./packages/notification/main.py
          target: /app/main.py
        - action: rebuild
          path: ./packages/notification/pyproject.toml
        - action: rebuild
          path: ./packages/notification/uv.lock

  booking:
    profiles: ["booking"]
    build: ./packages/booking
    environment:
      SERVER_PORT: "8083"
      DB_URL: jdbc:postgresql://postgres:5432/ticket_booking
      DB_USERNAME: ticket_booking
      DB_PASSWORD: ticket_booking
    ports:
      - "8083:8083"
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./packages/booking/src
        - action: rebuild
          path: ./packages/booking/pom.xml
        - action: rebuild
          path: ./packages/booking/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: